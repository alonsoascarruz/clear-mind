<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #1c1c20;
    --text: #f3f3f5;
    --muted: #8d8d96;
    --accent: #7b7cf6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { max-width: 480px; margin: 0 auto; padding: 14px 14px 110px; }

  .top { display: flex; align-items: center; gap: 10px; }
  .top .sp { flex: 1; }
  .round { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; }
  .round.add { width: 50px; height: 50px; background: var(--accent); font-size: 26px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .chips { display: flex; gap: 10px; overflow-x: auto; padding: 16px 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 11px 18px; border-radius: 999px; background: var(--panel); font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .chip[aria-pressed=true] { background: var(--accent); }

  .card { --c: #f5c518; border-radius: 28px; padding: 16px; margin-bottom: 16px; background: color-mix(in srgb, var(--c) 9%, #151517); border: 1px solid color-mix(in srgb, var(--c) 16%, transparent); }
  .head { display: flex; align-items: center; gap: 14px; }
  .ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 22%, #151517); flex: none; }
  .meta { flex: 1; min-width: 0; }
  .meta h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .meta p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  .check { width: 56px; height: 52px; border-radius: 16px; background: #2a2a2e; color: var(--muted); display: grid; place-items: center; flex: none; transition: background .15s, color .15s; }
  .check[aria-pressed=true] { background: var(--c); color: #111; }

  .heat { display: grid; gap: 3px; align-items: center; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--muted); }
  .card .heat { margin-top: 14px; }
  .heat .mo { white-space: nowrap; height: 14px; line-height: 14px; overflow: visible; min-width: 0; }
  .heat i { aspect-ratio: 1; border-radius: 30%; background: color-mix(in srgb, var(--c) 14%, #1b1b1e); }
  .heat i.on { background: var(--c); }
  .heat i.fut { background: none; }
  .heat i.today { background: none; border: 2px solid var(--muted); }
  .heat i.today.on { background: var(--c); border-color: var(--c); }
  .compact .heat { display: none; }
  .compact .card { padding: 12px 16px; margin-bottom: 10px; }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  .dock { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; border-radius: 999px; background: rgba(40,40,46,.85); backdrop-filter: blur(14px); }
  .dock button { width: 62px; height: 52px; border-radius: 999px; background: none; color: var(--muted); display: grid; place-items: center; }
  .dock button[aria-pressed=true] { background: #55555c; color: var(--text); }

  dialog { border: 0; border-radius: 24px; background: var(--panel); color: var(--text); width: min(92vw, 400px); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog label { display: block; font-size: 14px; color: var(--muted); margin-top: 12px; }
  dialog input, dialog select { width: 100%; margin-top: 4px; padding: 11px 12px; border-radius: 12px; border: 1px solid #3a3a42; background: #131315; color: var(--text); font: inherit; }
  .swatches { display: flex; gap: 10px; margin-top: 8px; }
  .swatches button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
  .swatches button[aria-pressed=true] { border-color: #fff; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .actions button { padding: 10px 18px; border-radius: 999px; background: #2e2e34; }
  .actions .ok { background: var(--accent); }
  .del { margin-right: auto; background: none !important; color: #ff6b6b; }

  /* ---------- detail view ---------- */
  #detail { --c: #f5c518; }
  #detail[hidden] { display: none; }
  .dtop { display: flex; align-items: center; gap: 10px; }
  .dtop .sp { flex: 1; }
  .dhead { display: flex; align-items: center; gap: 16px; margin: 22px 0 18px; }
  .dhead .ico { width: 66px; height: 66px; border-radius: 20px; }
  .dhead .ico svg { width: 32px; height: 32px; }
  .dhead h1 { margin: 0; font-size: 28px; line-height: 1.1; }
  .dhead p { margin: 6px 0 0; color: var(--muted); font-size: 17px; }
  .panel { border-radius: 28px; border: 1px solid color-mix(in srgb, var(--c) 16%, transparent); background: color-mix(in srgb, var(--c) 8%, #151517); padding: 14px; }
  .pills { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; color: var(--c); background: color-mix(in srgb, var(--c) 18%, #151517); font-family: ui-monospace, Menlo, monospace; font-size: 16px; }
  .pill svg { width: 20px; height: 20px; }
  .cal { padding: 14px 10px 12px; background: #151517; border-color: #26262b; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; text-align: center; font-family: ui-monospace, Menlo, monospace; }
  .cal-grid .wd { color: var(--muted); padding: 8px 0 10px; font-size: 15px; }
  .day { position: relative; height: 54px; margin: 0 4px; border-radius: 16px; background: none; color: #55555c; font: inherit; font-size: 20px; touch-action: manipulation; user-select: none; }
  .day.cur { color: #a5a5ad; }
  .day.fut { color: #3b3b41; }
  .day.on { background: var(--c); color: #111; font-weight: 700; }
  .day.today { box-shadow: inset 0 0 0 2.5px var(--c); }
  .day.on.today { box-shadow: inset 0 0 0 2.5px #fff6; }
  .day.note::after { content: ""; position: absolute; right: 8px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .day.on.note::after { background: #111; }
  .nav { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .nav .pickwrap, .nav .tdy { height: 48px; border-radius: 999px; background: #1f1f23; display: grid; place-items: center; padding: 0 16px; font-family: ui-monospace, Menlo, monospace; font-size: 16px; color: #b6b6bd; }
  .nav .pickwrap { flex: 1; }
  .nav input[type=month] { background: none; border: 0; color: inherit; font: inherit; text-align: center; }
  .nav .round { width: 48px; height: 48px; flex: none; }
  .hint { text-align: center; color: var(--muted); margin: 12px 0 2px; font-size: 15px; }
  dialog textarea { width: 100%; min-height: 90px; margin-top: 8px; padding: 10px 12px; border-radius: 12px; border: 1px solid #3a3a42; background: #131315; color: var(--text); font: inherit; resize: vertical; }

  /* ---------- edit sheet ---------- */
  #dlg { padding: 0; border: 0; width: min(100%, 480px); max-width: 100%; max-height: 94dvh; margin: auto auto 0; border-radius: 28px 28px 0 0; background: #111114; overflow: hidden; color-scheme: dark; --c: #facc15; }
  #dlg[open] { display: flex; flex-direction: column; }
  #dlg form { display: flex; flex-direction: column; min-height: 0; max-height: 94dvh; }
  .grab { width: 56px; height: 6px; border-radius: 3px; background: #2b2b31; margin: 10px auto 0; flex: none; }
  .sheet-top { display: flex; align-items: center; padding: 10px 14px; position: relative; flex: none; }
  .sheet-top h3 { position: absolute; left: 0; right: 0; text-align: center; margin: 0; font-size: 22px; pointer-events: none; }
  .sheet-body { overflow-y: auto; padding: 0 16px 16px; flex: 1; min-height: 0; }
  .lab { margin: 18px 4px 8px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #6f6f78; }
  #dlg input { display: block; width: 100%; height: 56px; margin: 0; padding: 0 20px; border-radius: 20px; border: 1px solid #26262b; background: #151517; color: var(--text); font: inherit; font-size: 19px; }
  .iconhero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 6px 0 10px; }
  .bigico { position: relative; width: 92px; height: 92px; border-radius: 50%; background: color-mix(in srgb, var(--c) 24%, #151517); color: var(--c); display: grid; place-items: center; }
  .bigico > span:first-child svg { width: 44px; height: 44px; }
  .bigico .pen { position: absolute; right: -2px; bottom: 2px; width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: #111; display: grid; place-items: center; }
  .bigico .pen svg { width: 16px; height: 16px; }
  .link { background: none; color: var(--c); font-size: 20px; }
  .icongrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 4px 0 6px; }
  .icongrid button { aspect-ratio: 1; border-radius: 14px; background: #1b1b1e; color: var(--muted); display: grid; place-items: center; }
  .icongrid button[aria-pressed=true] { background: color-mix(in srgb, var(--c) 25%, #1b1b1e); color: var(--c); }
  #dlg .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin: 0; }
  #dlg .swatches button { width: 100%; height: auto; aspect-ratio: 1; border-radius: 16px; border: 0; }
  #dlg .swatches button[aria-pressed=true] { outline: 3px solid var(--sw); outline-offset: 3px; }
  .seg { display: flex; gap: 4px; padding: 6px; border-radius: 24px; border: 1px solid #26262b; background: #151517; }
  .seg button { flex: 1; padding: 15px 6px; border-radius: 18px; background: none; color: var(--muted); font-size: 18px; }
  .seg button[aria-pressed=true] { background: #2a2a30; color: var(--text); }
  .hint { text-align: center; color: var(--muted); margin: 10px 0 0; font-size: 17px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #dlg .tile { position: relative; display: flex; align-items: center; height: 62px; margin: 0; padding: 0 16px; border-radius: 22px; border: 1px solid #26262b; background: #151517; }
  #dlg .tile::after { content: "\203A"; position: absolute; right: 16px; color: var(--muted); font-size: 24px; pointer-events: none; }
  #dlg .tile select { appearance: none; -webkit-appearance: none; width: 100%; height: 100%; margin: 0; padding: 0 24px 0 4px; border: 0; background: none; color: var(--text); font: inherit; font-size: 19px; }
  #dlg option { background: #1c1c20; color: #f3f3f5; }
  #fDel { display: block; width: 100%; margin-top: 22px; padding: 14px; border-radius: 18px; border: 1px solid #3a2a2c; }
  .sheet-foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); flex: none; }
  .save { width: 100%; height: 60px; border-radius: 999px; background: #8b8cf5; color: #fff; font-size: 20px; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <button class="round" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <span class="sp"></span>
    <button class="round add" id="add" aria-label="New habit">+</button>
  </div>
  <div class="chips" id="chips"></div>
  <main id="list"></main>
  <section id="detail" hidden></section>

  <!-- empty grid kept -->
  <div class="grid" id="grid"></div>
</div>

<div class="dock" id="dock" role="group" aria-label="View">
  <button id="vGrid" aria-pressed="true" aria-label="Heatmap view"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="4" height="4"/><rect x="10" y="5" width="4" height="4"/><rect x="16" y="5" width="4" height="4"/><rect x="4" y="13" width="4" height="4"/><rect x="10" y="13" width="4" height="4"/><rect x="16" y="13" width="4" height="4"/></svg></button>
  <button id="vList" aria-pressed="false" aria-label="Compact view"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
</div>

<dialog id="nDlg">
  <form method="dialog">
    <h3 id="nTitle" style="margin:0">Note</h3>
    <textarea id="nText" maxlength="300" placeholder="How did it go?"></textarea>
    <div class="actions">
      <button type="button" class="del" id="nDel">Delete</button>
      <button type="button" id="nCancel">Cancel</button>
      <button class="ok" id="nOk" value="ok">Save</button>
    </div>
  </form>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="grab"></div>
    <div class="sheet-top">
      <button type="button" class="round" id="fCancel" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h3 id="dTitle">Edit Habit</h3>
    </div>
    <div class="sheet-body">
      <div class="iconhero">
        <button type="button" class="bigico" id="bigIco" aria-label="Change icon"><span id="bigSvg"></span><span class="pen"><svg class="i" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span></button>
        <button type="button" class="link" id="chIcon">Change icon</button>
      </div>
      <div class="icongrid" id="iconGrid" hidden></div>

      <p class="lab">Name</p>
      <input id="fName" required maxlength="40" autocomplete="off">
      <p class="lab">Description</p>
      <input id="fSub" maxlength="50" autocomplete="off">

      <p class="lab">Color</p>
      <div class="swatches" id="swatches"></div>

      <p class="lab">Habit type</p>
      <div class="seg" id="segType"></div>
      <p class="hint" id="hType"></p>

      <p class="lab">Tracking</p>
      <div class="seg" id="segTrack"></div>
      <p class="hint" id="hTrack"></p>

      <div class="two">
        <div><p class="lab">Streak goal</p><label class="tile"><select id="fGoal" aria-label="Streak goal"></select></label></div>
        <div><p class="lab">Reminder</p><label class="tile"><select id="fRem" aria-label="Reminder"></select></label></div>
      </div>

      <p class="lab">Categories</p>
      <label class="tile"><select id="fCat" aria-label="Category"></select></label>

      <button type="button" class="del" id="fDel" hidden>Delete habit</button>
    </div>
    <div class="sheet-foot"><button class="save" id="fOk" value="ok">Save</button></div>
  </form>
</dialog>

<script>
const COLORS = ["#f87171","#fb923c","#fbbf24","#facc15","#a3e635","#4ade80","#34d399","#2dd4bf","#22d3ee","#38bdf8","#60a5fa","#818cf8","#a78bfa","#c084fc","#e879f9","#f472b6","#fb7185","#94a3b8","#9ca3af","#a1a1aa","#a8a29e"];
const ICONS = {
  pulse: "M3 12h4l2.5-6 4 12 2.5-6H21",
  heart: "M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z",
  book: "M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20",
  pen: "M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",
  star: "M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z",
  flame: "M12 3c3 3.5 6 6 6 10a6 6 0 0 1-12 0c0-2 1-3.5 2.5-5 .3 1.5 1 2.3 2 2.5C10 8 10.5 5.5 12 3z",
  drop: "M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z",
  moon: "M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z",
  sun: "M8 12a4 4 0 1 0 8 0 4 4 0 1 0-8 0M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4",
  coffee: "M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h2a2 2 0 0 1 0 4h-2M7 2v3M11 2v3",
  dumbbell: "M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12",
  bike: "M3 17a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M14 17a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M6.5 17L10 8h4l3.5 9M9 8H7",
  music: "M9 18V5l12-2v13M3 18a3 3 0 1 0 6 0 3 3 0 1 0-6 0M15 16a3 3 0 1 0 6 0 3 3 0 1 0-6 0",
  check: "M9 12l2 2 4-4M3 12a9 9 0 1 0 18 0 9 9 0 1 0-18 0"
};
const iconSvg = h => `<svg class="i" viewBox="0 0 24 24"><path d="${ICONS[h.icon] || ICONS.pulse}"/></svg>`;
const WEEKS = 26, KEY = "habits.v1";
const $ = s => document.querySelector(s);
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const todayKey = () => dayKey(new Date());

let state = { habits: [
  { id: 1, name: "Read my book",        sub: "Read one sentence.", cat: "Study",  color: COLORS[3], days: [] },
  { id: 2, name: "Date with my wife",   sub: "",                   cat: "Family", color: COLORS[3], days: [] },
  { id: 3, name: "Read BOM in Chinese", sub: "Even one verse",     cat: "Study",  color: COLORS[0], days: [] },
  { id: 4, name: "Read BOM in English", sub: "Even one verse",     cat: "Study",  color: COLORS[9], days: [] }
], filter: "All", compact: false };

try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.habits) state = s; } catch (e) {}
const enviar = () => fetch("/api/habitos", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) }).catch(() => {});
let saveTimer = null;
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}   // local copy (offline fallback)
  clearTimeout(saveTimer); saveTimer = setTimeout(enviar, 300);            // send to MySQL
};
async function cargar() {
  try {
    const r = await fetch("/api/habitos"); if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    if (s && s.habits) { state = s; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} render(); }
    else enviar();                                   // database empty: upload what this device has
  } catch (e) { /* server unreachable: keep the local copy */ }
}

function render() {
  const cats = ["All", ...new Set(state.habits.map(h => h.cat).filter(Boolean))];
  if (!cats.includes(state.filter)) state.filter = "All";
  $("#chips").innerHTML = cats.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${c === state.filter}">${c}</button>`).join("");
  $("#app").classList.toggle("compact", state.compact);
  $("#vGrid").setAttribute("aria-pressed", !state.compact);
  $("#vList").setAttribute("aria-pressed", state.compact);
  $("#detail").hidden = viewId === null;
  $(".top").hidden = $("#chips").hidden = $("#list").hidden = $("#dock").hidden = viewId !== null;
  if (viewId !== null) return renderDetail();

  const t = todayKey();
  const list = state.habits.filter(h => state.filter === "All" || h.cat === state.filter);
  $("#list").innerHTML = list.length ? list.map(h => `
    <article class="card" style="--c:${h.color}" data-id="${h.id}">
      <div class="head">
        <button class="ico" data-edit aria-label="Edit ${h.name}">${iconSvg(h)}</button>
        <div class="meta"><h2>${h.name}</h2>${h.sub ? `<p>${h.sub}</p>` : ""}</div>
        <button class="check" data-check aria-pressed="${h.days.includes(t)}" aria-label="Mark ${h.name} done today"><svg class="i" viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      </div>
      ${heatmap(h)}
    </article>`).join("") : `<p class="empty">No habits here yet. Tap + to add one.</p>`;
}

let viewId = null, vm = new Date();
const find = el => state.habits.find(h => h.id == el.closest(".card").dataset.id);

$("#list").addEventListener("click", e => {
  if (e.target.closest("[data-check]")) {
    const h = find(e.target), t = todayKey();
    h.days = h.days.includes(t) ? h.days.filter(d => d !== t) : [...h.days, t];
    save(); render();
  } else if (e.target.closest("[data-edit]")) openDlg(find(e.target));
  else if (e.target.closest(".card")) openDetail(find(e.target).id);
});
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  state.filter = b.dataset.cat; save(); render();
});
$("#vGrid").onclick = () => { state.compact = false; save(); render(); };
$("#vList").onclick = () => { state.compact = true; save(); render(); };

const TYPES = { build: ["Build A Habit", "Mark each day you complete it."], quit: ["Quit A Habit", "Mark each day you stay away from it."] };
const TRACKS = { yesno: ["Yes / No", "Check the day off \u2014 done or not done"], count: ["Count", "Count how many times you did it each day."], measure: ["Measure", "Log a value each day, like pages or minutes."] };
const GOALS = [0, 7, 14, 21, 30, 60, 100, 365], REMS = ["", "07:00", "09:00", "12:00", "18:00", "21:00"];
let editing = null, f = {}, lastCat = "";

function seg(sel, obj, cur) {
  $(sel).innerHTML = Object.entries(obj).map(([k, v]) => `<button type="button" data-k="${k}" aria-pressed="${k === cur}">${v[0]}</button>`).join("");
}
function paintDlg() {
  $("#dlg").style.setProperty("--c", f.color);
  $("#bigSvg").innerHTML = iconSvg(f);
  $("#iconGrid").innerHTML = Object.keys(ICONS).map(k => `<button type="button" data-ic="${k}" aria-pressed="${k === f.icon}" aria-label="${k}"><svg class="i" viewBox="0 0 24 24"><path d="${ICONS[k]}"/></svg></button>`).join("");
  $("#swatches").innerHTML = COLORS.map(c => `<button type="button" style="background:${c};--sw:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${c === f.color}"></button>`).join("");
  seg("#segType", TYPES, f.type); seg("#segTrack", TRACKS, f.track);
  $("#hType").textContent = TYPES[f.type][1]; $("#hTrack").textContent = TRACKS[f.track][1];
}
function fillCat(cur) {
  const cats = [...new Set(state.habits.map(h => h.cat).filter(Boolean))];
  if (cur && !cats.includes(cur)) cats.push(cur);
  $("#fCat").replaceChildren(new Option("None", ""), ...cats.map(c => new Option(c, c)), new Option("+ New category\u2026", "__new"));
  $("#fCat").value = cur || ""; lastCat = cur || "";
}
$("#fCat").addEventListener("change", e => {
  if (e.target.value === "__new") fillCat((prompt("Category name") || "").trim().slice(0, 20) || lastCat);
  else lastCat = e.target.value;
});
$("#dlg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.ic) f.icon = b.dataset.ic;
  else if (b.dataset.c) f.color = b.dataset.c;
  else if (b.closest("#segType")) f.type = b.dataset.k;
  else if (b.closest("#segTrack")) f.track = b.dataset.k;
  else if (b.id === "bigIco" || b.id === "chIcon") { $("#iconGrid").hidden = !$("#iconGrid").hidden; return; }
  else return;
  paintDlg();
});
function openDlg(h) {
  editing = h || null;
  f = { icon: h?.icon || "pulse", color: h?.color || COLORS[3], type: h?.type || "build", track: h?.track || "yesno" };
  $("#dTitle").textContent = h ? "Edit Habit" : "New Habit";
  $("#fName").value = h ? h.name : ""; $("#fSub").value = h ? h.sub : "";
  fillCat(h ? h.cat : (state.filter === "All" ? "" : state.filter));
  const goals = [...new Set([...GOALS, h?.goal || 0])].sort((a, b) => a - b);
  $("#fGoal").replaceChildren(...goals.map(g => new Option(g ? g + " days" : "None", g))); $("#fGoal").value = h?.goal || 0;
  const rems = [...new Set([...REMS, h?.reminder || ""])].sort();
  $("#fRem").replaceChildren(...rems.map(r => new Option(r || "No Reminders", r))); $("#fRem").value = h?.reminder || "";
  $("#fDel").hidden = !h; $("#iconGrid").hidden = true; paintDlg();
  $("#dlg").showModal(); if (!h) $("#fName").focus();
}
$("#add").onclick = () => openDlg(null);
$("#fCancel").onclick = () => $("#dlg").close();
$("#fDel").onclick = () => { if (!confirm("Delete this habit?")) return; state.habits = state.habits.filter(h => h !== editing); save(); render(); $("#dlg").close(); };
$("#form").addEventListener("submit", () => {
  const name = $("#fName").value.trim(); if (!name) return;
  const cat = $("#fCat").value === "__new" ? "" : $("#fCat").value;
  const data = { name, sub: $("#fSub").value.trim(), cat, color: f.color, icon: f.icon, type: f.type, track: f.track, goal: +$("#fGoal").value || null, reminder: $("#fRem").value };
  if (editing) Object.assign(editing, data);
  else state.habits.push({ id: Date.now(), days: [], ...data });
  save(); render();
});

/* ---------- detail view ---------- */
const GEAR = document.querySelector(".top .round svg").outerHTML;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));

function streak(h) {
  const s = new Set(h.days); let d = new Date();
  if (!s.has(dayKey(d))) d = addDays(d, -1);
  let n = 0; while (s.has(dayKey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function openDetail(id) { viewId = id; vm = new Date(); vm.setDate(1); render(); window.scrollTo(0, 0); }
function closeDetail() { viewId = null; render(); }

function heatmap(h, labels) {   // labels=true adds month + weekday labels (detail screen)
  const set = new Set(h.days), t = todayKey(), start = addDays(mondayOf(new Date()), -(WEEKS - 1) * 7);
  let out = "";
  if (labels) {
    out += `<span></span>`;
    for (let w = 0; w < WEEKS; w++) {
      const m = addDays(start, w * 7);
      out += `<span class="mo">${m.getDate() <= 7 ? MON[m.getMonth()] : ""}</span>`;
    }
  }
  for (let r = 0; r < 7; r++) {
    if (labels) out += `<span>${[1,3,5].includes(r) ? WD[r] : ""}</span>`;
    for (let w = 0; w < WEEKS; w++) {
      const k = dayKey(addDays(start, w * 7 + r));
      out += `<i class="${set.has(k) ? "on " : ""}${k > t ? "fut " : ""}${k === t ? "today" : ""}" title="${k}"></i>`;
    }
  }
  return `<div class="heat" style="grid-template-columns:${labels ? "auto " : ""}repeat(${WEEKS},minmax(0,1fr))">${out}</div>`;
}

function renderDetail() {
  const h = state.habits.find(x => x.id === viewId);
  if (!h) return closeDetail();
  const set = new Set(h.days), notes = h.notes || {}, t = todayKey();
  const first = new Date(vm.getFullYear(), vm.getMonth(), 1), last = new Date(vm.getFullYear(), vm.getMonth() + 1, 0);
  const from = mondayOf(first), to = addDays(last, 6 - ((last.getDay() + 6) % 7));
  let cells = "";
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const k = dayKey(d);
    cells += `<button class="day ${d.getMonth() === vm.getMonth() ? "cur " : ""}${k > t ? "fut " : ""}${set.has(k) ? "on " : ""}${k === t ? "today " : ""}${notes[k] ? "note" : ""}" data-k="${k}" aria-pressed="${set.has(k)}" aria-label="${k}">${d.getDate()}</button>`;
  }
  const arrow = d => `<svg class="i" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  const sk = streak(h);
  $("#detail").style.setProperty("--c", h.color);
  $("#detail").innerHTML = `
    <div class="dtop">
      <button class="round" id="dBack" aria-label="Back">${arrow("M15 6l-6 6 6 6")}</button><span class="sp"></span>
      <button class="round" id="dEdit" aria-label="Edit habit"><svg class="i" viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
      <button class="round" id="dGoal" aria-label="Streak goal">${GEAR}</button>
    </div>
    <div class="dhead">
      <div class="ico">${iconSvg(h)}</div>
      <div><h1>${h.name}</h1>${h.sub ? `<p>${h.sub}</p>` : ""}</div>
    </div>
    <div class="panel">${heatmap(h, true)}</div>
    <div class="pills">
      <span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M12 3c3 3.5 6 6 6 10a6 6 0 0 1-12 0c0-2 1-3.5 2.5-5 .3 1.5 1 2.3 2 2.5C10 8 10.5 5.5 12 3z"/></svg>${sk}</span>
      <button class="pill" id="goal"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>${h.goal ? "Goal: " + h.goal + " days" : "No Streak Goal"}</button>
    </div>
    <div class="panel cal">
      <div class="cal-grid">${WD.map(w => `<span class="wd">${w}</span>`).join("")}${cells}</div>
      <div class="nav">
        <label class="pickwrap"><input type="month" id="mSel" value="${vm.getFullYear()}-${String(vm.getMonth()+1).padStart(2,"0")}" aria-label="Month"></label>
        <button class="tdy" id="dToday">Today</button>
        <button class="round" id="dPrev" aria-label="Previous month">${arrow("M15 6l-6 6 6 6")}</button>
        <button class="round" id="dNext" aria-label="Next month">${arrow("M9 6l6 6-6 6")}</button>
      </div>
      <p class="hint">Press and hold a day to add a note</p>
    </div>`;
}

let pressTimer = null, held = false, noteKey = null;
const D = () => $("#detail");
function shiftMonth(n) { vm = new Date(vm.getFullYear(), vm.getMonth() + n, 1); renderDetail(); }

D().addEventListener("click", e => {
  const h = state.habits.find(x => x.id === viewId), b = e.target.closest("button");
  if (!b) return;
  if (b.id === "dBack") closeDetail();
  else if (b.id === "dEdit") openDlg(h);
  else if (b.id === "dGoal" || b.id === "goal") {
    const v = prompt("Streak goal in days (empty = none)", h.goal || "");
    if (v !== null) { h.goal = Math.max(0, parseInt(v, 10) || 0) || null; save(); renderDetail(); }
  }
  else if (b.id === "dToday") { vm = new Date(); vm.setDate(1); renderDetail(); }
  else if (b.id === "dPrev") shiftMonth(-1);
  else if (b.id === "dNext") shiftMonth(1);
  else if (b.dataset.k) {
    if (held) { held = false; return; }
    if (b.dataset.k > todayKey()) return;
    const k = b.dataset.k;
    h.days = h.days.includes(k) ? h.days.filter(d => d !== k) : [...h.days, k];
    save(); renderDetail();
  }
});
D().addEventListener("change", e => {
  if (e.target.id === "mSel" && e.target.value) { const [y, m] = e.target.value.split("-"); vm = new Date(+y, m - 1, 1); renderDetail(); }
});
D().addEventListener("pointerdown", e => {
  const b = e.target.closest(".day"); if (!b) return;
  held = false;
  pressTimer = setTimeout(() => { held = true; openNote(b.dataset.k); }, 500);
});
["pointerup", "pointerleave", "pointercancel", "scroll"].forEach(ev => D().addEventListener(ev, () => clearTimeout(pressTimer), true));
D().addEventListener("contextmenu", e => { if (e.target.closest(".day")) e.preventDefault(); });

function openNote(k) {
  const h = state.habits.find(x => x.id === viewId);
  noteKey = k; $("#nTitle").textContent = "Note for " + k; $("#nText").value = (h.notes || {})[k] || "";
  $("#nDlg").showModal();
}
$("#nCancel").onclick = () => $("#nDlg").close();
$("#nDel").onclick = () => { $("#nText").value = ""; $("#nOk").click(); };
$("#nDlg form").addEventListener("submit", () => {
  const h = state.habits.find(x => x.id === viewId); h.notes = h.notes || {};
  const v = $("#nText").value.trim();
  if (v) h.notes[noteKey] = v; else delete h.notes[noteKey];
  save(); renderDetail();
});
render();
cargar();
</script>
<script src="/menu.js"></script>
</body>
</html>
